services:
  api:
    build: .
    image: transit-hunter:latest
    command: ["uvicorn", "transit_hunter.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - path: .env
        required: false
    environment:
      TH_DATA_DIR: /app/data
      TH_MODELS_DIR: /app/models
      TH_CACHE_DIR: /app/data/cache
      TH_LIGHTKURVE_CACHE_DIR: /app/data/raw
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  ui:
    image: transit-hunter:latest
    command:
      ["streamlit", "run", "frontend/app.py", "--server.port", "8501",
       "--server.address", "0.0.0.0", "--server.headless", "true"]
    environment:
      TH_API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
