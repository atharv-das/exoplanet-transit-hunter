[project]
name = "transit-hunter"
version = "0.1.0"
description = "Exoplanet Transit Hunter & Light-Curve Classifier: fetch, search, and classify transit signals from Kepler/TESS light curves."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.13"
authors = [{ name = "Transit Hunter Team" }]
dependencies = [
    # Astronomy
    "lightkurve>=2.4,<3",
    "astropy>=6.0",
    "astroquery>=0.4.7",
    "wotan>=1.10",
    # Data
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15.0",
    "scipy>=1.11",
    # ML
    "torch>=2.3",
    "lightgbm>=4.3",
    "scikit-learn>=1.4",
    "captum>=0.7",
    # Backend
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "diskcache>=5.6",
    "httpx>=0.27",
    # Frontend
    "streamlit>=1.35",
    "plotly>=5.20",
    # Utilities
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "joblib>=1.3",
]

[project.optional-dependencies]
# Stretch goals and the synthetic-injection fallback. batman-package compiles C on some platforms.
stretch = [
    "transitleastsquares>=1.32",
    "batman-package>=2.4.9",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-PyYAML>=6.0",
    "types-requests>=2.31",
    "jupyter>=1.0",
]

[project.scripts]
transit-hunter-api = "transit_hunter.api.main:run"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transit_hunter"]

# CPU-only PyTorch on Linux/Windows (avoids ~2 GB of CUDA wheels). macOS PyPI wheels are already CPU/MPS.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "NPY"]
ignore = [
    "N803", # argument names like `X` are conventional in ML code
    "N806", # variable names like `X_train`
    "N812", # `import torch.nn.functional as F` is the PyTorch convention
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"frontend/*" = ["E501"]  # long UI copy and inline HTML read better unwrapped

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not network'"
markers = [
    "network: test needs live access to MAST / NASA Exoplanet Archive (run with: pytest -m network)",
    "slow: test takes more than a few seconds",
]
filterwarnings = [
    "ignore::DeprecationWarning:lightkurve.*",
    "ignore::DeprecationWarning:astropy.*",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
