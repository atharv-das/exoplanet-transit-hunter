# Streamlit reads this from the working directory (the repo root for `make ui` / `make demo`).
[theme]
base = "dark"
primaryColor = "#3987e5"
backgroundColor = "#111110"
secondaryBackgroundColor = "#1a1a19"
textColor = "#f0efec"
font = "sans serif"

[server]
headless = true
runOnSave = false

[browser]
gatherUsageStats = false
