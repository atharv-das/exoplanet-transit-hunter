name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff format check
        run: uv run ruff format --check src tests scripts frontend

      - name: Ruff lint
        run: uv run ruff check src tests scripts frontend

      - name: mypy
        run: uv run mypy

      - name: Tests (offline only; network tests are excluded by default)
        run: uv run pytest --cov=transit_hunter --cov-report=term-missing
